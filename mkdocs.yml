site_name: RuhrMobilityBlog
site_description: Researching sustainable mobility solutions for the Ruhr region
site_url: https://ruhrmobilitylabs.github.io
copyright: RuhrMobilityLabs

theme:
  name: material
  language: de
  favicon: icon.png
  logo: icon.png
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - header.autohide

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/projects-map.js
  - javascripts/station-map.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.mark
  - pymdownx.critic
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - def_list
  - tables
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - footnotes

hooks:
  - hooks/download_leaflet.py

plugins:
  - search
  - offline
  - optimize
  - privacy
  - macros:
      module_name: docs/macros/overviewlists

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ruhrmobilitylabs
